<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Coin Puzzle</title>
  <link rel="stylesheet" href="./css/style.css?v=639.0">
  <link rel="stylesheet" href="./css/board.css?v=639.0">
  <link rel="stylesheet" href="./css/coin.css?v=639.0">
</head>

<body>

  <!-- loading screen moved inside game-container -->

  <div id="game-container">
    <!-- Loading Screen Overlay -->
    <div id="loading-screen">
      <!-- Top Logo -->
      <img src="./Assets/Loading/Logo Titile_.png" alt="Coin Puzzle Logo" class="loading-logo" />

      <!-- Center Art -->
      <img src="./Assets/Loading/Coins In Pockets_.png" alt="Coins in pockets" class="loading-center-art" />

      <!-- Loading Bar Area -->
      <div class="loading-bar-wrapper">
        <div class="loading-text">LOADING...</div>
        <div class="loading-bar-graphics">
          <img src="./Assets/Loading/Loading Bar_.png" alt="Loading frame" class="loading-bar-frame-img" />
          <img src="./Assets/Loading/Loading Fill_.png" alt="Loading fill" class="loading-bar-fill-img" />
        </div>
      </div>
    </div>
    
    <div id="top-hud">
      <!-- Left Side -->
      <div class="hud-left">
        <div class="hud-level-text">LEVEL <span id="ui-score">1</span></div>
        <div class="hud-coin-bases">
          <div class="hud-coin-base">
            <span class="hud-coin-count">3</span>
          </div>
          <div class="hud-coin-base">
            <span class="hud-coin-count">11</span>
          </div>
        </div>
      </div>
      
      <!-- Right Side -->
      <div class="hud-right">
        <div class="hud-top-row">
          <!-- Heart Bar -->
          <div class="hud-bar-group">
            <div class="hud-heart-wrapper">
              <img src="./Assets/Gameplay/Heart.png" class="hud-heart-icon">
              <span class="heart-text">5</span>
            </div>
            <div class="hud-bar-bg">
              <img src="./Assets/Gameplay/Bar_.png" class="hud-bar-img">
              <span class="bar-text">Full</span>
            </div>
          </div>
          
          <!-- Gem Bar -->
          <div class="hud-bar-group">
            <img src="./Assets/Gameplay/Plus Icon_.png" alt="Add" class="hud-plus-icon" />
            <div class="hud-bar-bg long-bar">
              <img src="./Assets/Gameplay/Long Bar.png" alt="Bar" class="hud-bar-img" />
              <span class="bar-text">300</span>
            </div>
            <img src="./Assets/Gameplay/Gem.png" alt="Gems" class="hud-gem-icon" />
          </div>
        </div>
        <img src="./Assets/Gameplay/Settings.png" alt="Settings" class="hud-settings-icon" />
      </div>
    </div>

    <div class="board-3d-wrapper">
      <div id="game-board"></div>

      <!-- Controls (Bottom) -->
      <div class="controls">
        <button id="btn-drop" class="drop-btn-custom">
          <img src="./Assets/Gameplay/Coins_.png" class="drop-btn-icon" alt="Coins" />
          <span class="drop-btn-text">DROP</span>
        </button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modal">
    <div class="modal-content">
      <h2 class="modal-title" id="modal-title">Game Over</h2>
      <p class="modal-msg" id="modal-msg">No more valid moves!</p>
      <button id="btn-modal-restart" style="width: 100%;">Play Again</button>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const loadingFill = document.querySelector('.loading-bar-fill-img');
      const loadingScreen = document.getElementById('loading-screen');
      
      // Simulate loading progress
      let progress = 0;
      const interval = setInterval(() => {
        progress += Math.random() * 12; // Random jump
        if (progress > 100) progress = 100;
        
        // Use clip-path inset from right side to mask the image perfectly
        loadingFill.style.clipPath = `inset(0 ${100 - progress}% 0 0)`;
        
        if (progress === 100) {
          clearInterval(interval);
          
          // Wait 1 full second after hitting 100% before revealing the game!
          setTimeout(() => {
            loadingScreen.classList.add('hidden');
          }, 1000);
        }
      }, 100); // Tick faster for smoother animation
    });
  </script>
  <script type="module" src="./js/main.js?v=639.0"></script>
</body>

</html>

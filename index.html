<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Coin Puzzle</title>
  <link rel="stylesheet" href="./css/style.css?v=607.0">
  <link rel="stylesheet" href="./css/board.css?v=607.0">
  <link rel="stylesheet" href="./css/coin.css?v=607.0">
</head>

<body>

  <div id="game-container">
    <header>
      <div class="stat">
        <span class="stat-label">Level</span>
        <span class="stat-value" id="ui-score">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">Target Coin</span>
        <span class="stat-value" id="ui-target">6</span>
      </div>
    </header>

    <div id="game-board"></div>

    <div class="controls">
      <button id="btn-drop">Drop Coins</button>
      <button id="btn-restart">Restart</button>
    </div>
  </div>

  <div class="modal-overlay" id="modal">
    <div class="modal-content">
      <h2 class="modal-title" id="modal-title">Game Over</h2>
      <p class="modal-msg" id="modal-msg">No more valid moves!</p>
      <button id="btn-modal-restart" style="width: 100%;">Play Again</button>
    </div>
  </div>

  <script type="module" src="./js/main.js?v=617.0"></script>
</body>

</html>

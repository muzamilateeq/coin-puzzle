<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Coin Puzzle</title>
  
  <!-- Preload Critical Loading Screen Assets First -->
  <link rel="preload" as="image" href="./Assets/Loading/BG_.png">
  <link rel="preload" as="image" href="./Assets/Loading/Logo Titile_.png">
  <link rel="preload" as="image" href="./Assets/Loading/Coins In Pockets_.png">
  <link rel="preload" as="image" href="./Assets/Loading/Loading Bar_.png">
  <link rel="preload" as="image" href="./Assets/Loading/Loading Fill_.png">

  <link rel="stylesheet" href="./css/style.css?v=639.0">
  <link rel="stylesheet" href="./css/board.css?v=639.0">
  <link rel="stylesheet" href="./css/coin.css?v=639.0">
  <link rel="stylesheet" href="./css/settings.css?v=639.0">
</head>

<body>

  <!-- loading screen moved inside game-container -->
  <div id="game-container">
    <!-- Loading Screen Overlay -->
    <div id="loading-screen">
      <!-- Top Logo -->
      <img src="./Assets/Loading/Logo Titile_.png" alt="Coin Puzzle Logo" class="loading-logo" />

      <!-- Center Art -->
      <img src="./Assets/Loading/Coins In Pockets_.png" alt="Coins in pockets" class="loading-center-art" />

      <!-- Loading Bar Area -->
      <div class="loading-bar-wrapper">
        <div class="loading-text">LOADING...</div>
        <div class="loading-bar-graphics">
          <img src="./Assets/Loading/Loading Bar_.png" alt="Loading frame" class="loading-bar-frame-img" />
          <img src="./Assets/Loading/Loading Fill_.png" alt="Loading fill" class="loading-bar-fill-img" />
        </div>
      </div>
    </div>
    
    <div id="top-hud">
      <!-- Left Side -->
      <div class="hud-left">
        <div class="hud-level-text">LEVEL <span id="ui-score">1</span></div>
        <div class="hud-coin-bases">
          <div class="hud-coin-base">
            <span class="hud-coin-count">3</span>
          </div>
          <div class="hud-coin-base">
            <span class="hud-coin-count">11</span>
          </div>
        </div>
      </div>
      
      <!-- Right Side -->
      <div class="hud-right">
        <div class="hud-top-row">
          <!-- Heart Bar -->
          <div class="hud-bar-group">
            <div class="hud-heart-wrapper">
              <img src="./Assets/Gameplay/Heart.png" class="hud-heart-icon">
              <span class="heart-text" id="ui-hearts">5</span>
            </div>
            <div class="hud-bar-bg">
              <img src="./Assets/Gameplay/Bar_.png" class="hud-bar-img">
              <span class="bar-text" id="ui-heart-timer">Full</span>
            </div>
          </div>
          
          <!-- Gem Bar -->
          <div class="hud-bar-group">
            <img src="./Assets/Gameplay/Plus Icon_.png" alt="Add" class="hud-plus-icon" />
            <div class="hud-bar-bg long-bar">
              <img src="./Assets/Gameplay/Long Bar.png" alt="Bar" class="hud-bar-img" />
              <span class="bar-text" id="ui-gems">300</span>
            </div>
            <img src="./Assets/Gameplay/Gem.png" alt="Gems" class="hud-gem-icon" />
          </div>
        </div>
        <img src="./Assets/Gameplay/Settings.png" alt="Settings" class="hud-settings-icon" id="btn-settings" style="cursor: pointer;" />
      </div>
    </div>

    <div class="perspective-wrapper" style="width: 100%; display: flex; flex-direction: column; align-items: center; perspective: 1200px;">
      <div class="board-3d-wrapper">
        <div id="game-board"></div>

        <!-- Controls (Bottom) -->
        <div class="controls">
          <button id="btn-drop" class="drop-btn-custom">
            <img src="./Assets/Gameplay/Coins_.png" class="drop-btn-icon" alt="Coins" />
            <span class="drop-btn-text">DROP</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Settings Modal Overlay -->
  <div class="modal-overlay hidden" id="settings-modal">
    <div class="settings-modal-content">
      <!-- Close Button -->
      <img src="./Assets/Settings/Cross.png" alt="Close" id="btn-settings-close" class="settings-close-btn" />

      <!-- Settings Frame Background -->
      <img src="./Assets/Settings/Layer 27.png" alt="Settings Frame" class="settings-frame-img" />

      <!-- Settings Header Text -->
      <div class="settings-header-text">Settings</div>

      <!-- Inner Settings Body -->
      <div class="settings-inner-body">
        <!-- Toggles Buttons -->
        <div class="settings-toggles-row">
          <button id="toggle-music" class="settings-toggle-btn" title="Toggle Music">
            <img src="./Assets/Settings/Toggles Base.png" class="settings-toggle-bg" alt="Base" />
            <img src="./Assets/Settings/Music On_.png" id="img-toggle-music" class="settings-toggle-icon" alt="Music" />
          </button>
          <button id="toggle-sound" class="settings-toggle-btn" title="Toggle Sound">
            <img src="./Assets/Settings/Toggles Base.png" class="settings-toggle-bg" alt="Base" />
            <img src="./Assets/Settings/Sound On_.png" id="img-toggle-sound" class="settings-toggle-icon" alt="Sound" />
          </button>
          <button id="toggle-vibrate" class="settings-toggle-btn" title="Toggle Vibration">
            <img src="./Assets/Settings/Toggles Base.png" class="settings-toggle-bg" alt="Base" />
            <img src="./Assets/Settings/Vibrate On_.png" id="img-toggle-vibrate" class="settings-toggle-icon" alt="Vibration" />
          </button>
        </div>

        <!-- Restart Button -->
        <button id="btn-settings-restart" class="settings-restart-btn">
          <span class="restart-text">RESTART</span>
          <div class="restart-heart-badge">
            <img src="./Assets/Gameplay/Heart.png" alt="Heart" class="restart-heart-icon" />
            <span class="restart-heart-text">-1</span>
          </div>
        </button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modal">
    <div class="modal-content">
      <h2 class="modal-title" id="modal-title">Level Complete</h2>
      <p class="modal-msg" id="modal-msg">Great job!</p>
      <button id="btn-modal-restart" style="width: 100%;">Play Again</button>
    </div>
  </div>

  <script>
    window.updateLoadingProgress = function(percent) {
      const loadingFill = document.querySelector('.loading-bar-fill-img');
      if (loadingFill) {
        loadingFill.style.clipPath = `inset(0 ${100 - percent}% 0 0)`;
      }
    };

    window.hideLoadingScreen = function() {
      const loadingScreen = document.getElementById('loading-screen');
      if (loadingScreen) {
        loadingScreen.classList.add('hidden');
        setTimeout(() => loadingScreen.remove(), 500); // Clean up DOM
      }
    };
  </script>
  <script type="module" src="./js/main.js?v=639.0"></script>
</body>

</html>
